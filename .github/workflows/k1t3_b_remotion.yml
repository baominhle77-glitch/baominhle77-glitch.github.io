name: k1t3-B-remotion-60s
on:
  push:
    branches: [gpt/k1t3-B-remotion]
    paths:
      - 'ci/remotion_b/**'
      - '.github/workflows/k1t3_b_remotion.yml'
      - 'assets/k1t3/broll_gemini/**'
      - 'tools/do_chuyen_dong_vung.py'
      - 'ci/chuyen_dong_vung.py'
      - 'gate_chung/**'
      - 'the_loai/**'
  workflow_dispatch:
    inputs:
      render_1080:
        description: Native 1080p only after every 540p gate passes
        type: boolean
        default: false
concurrency:
  group: k1t3-B-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  PYTHONIOENCODING: utf-8
  NLTK_DATA: ${{ github.workspace }}/work/gate_nlp
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  manim:
    name: Manim 540p / ${{ matrix.beat }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        beat: [h1, h2, h3, h4, c1, p1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Beat source fingerprint
        id: fingerprint
        run: echo "key=$(python ci/remotion_b/beat_cache.py --beat ${{ matrix.beat }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: beat-cache
        with:
          path: work/B_cache/540/${{ matrix.beat }}
          key: B-media-v3-${{ runner.os }}-${{ matrix.beat }}-${{ steps.fingerprint.outputs.key }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: B-pip-${{ runner.os }}-py311-${{ hashFiles('ci_requirements.txt') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: ci/remotion_b/node_modules
          key: B-node-${{ runner.os }}-22-${{ hashFiles('ci/remotion_b/package-lock.json') }}
      - name: Native toolchain, no apt FFmpeg
        if: steps.beat-cache.outputs.cache-hit != 'true'
        run: bash ci/remotion_b/setup_native.sh manim
      - name: Cached Python and Node packages
        env:
          B_MEDIA_CACHE_HIT: ${{ steps.beat-cache.outputs.cache-hit }}
        run: |
          if [ "$B_MEDIA_CACHE_HIT" != "true" ]; then python -m pip install -q -r ci_requirements.txt; fi
          if [ ! -x ci/remotion_b/node_modules/@remotion/compositor-linux-x64-gnu/ffmpeg ]; then
            npm ci --prefix ci/remotion_b --no-audit --no-fund
          fi
          echo "$GITHUB_WORKSPACE/ci/remotion_b/node_modules/@remotion/compositor-linux-x64-gnu" >> "$GITHUB_PATH"
      - name: This beat only, both native 540p formats at 30fps
        run: |
          python -u ci/remotion_b/prepare.py --beat ${{ matrix.beat }} --jobs 1
          python ci/remotion_b/finish_beat.py --beat ${{ matrix.beat }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B-beat-540-${{ matrix.beat }}
          retention-days: 14
          path: |
            work/B_cache/540/${{ matrix.beat }}/*.mp4
            work/B_cache/540/${{ matrix.beat }}/*.json
            work/B_cache/540/${{ matrix.beat }}/stills/
            work/B_cache/540/${{ matrix.beat }}/media/**/render.log
  remotion:
    name: Remotion 540p + unchanged gates
    needs: manim
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      gates: ${{ steps.gates.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ci/remotion_b/node_modules
          key: B-node-${{ runner.os }}-22-${{ hashFiles('ci/remotion_b/package-lock.json') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: B-measure-${{ runner.os }}-py311-${{ hashFiles('ci_requirements.txt') }}
      - uses: actions/download-artifact@v4
        with:
          pattern: B-beat-540-*
          path: work/beat-download
      - name: Collect six matrix artifacts
        run: python ci/remotion_b/collect_beats.py --short-side 540
      - uses: actions/cache@v4
        with:
          path: work/gate_nlp
          key: D18-nlp-v1-${{ runner.os }}
      - name: Chrome runtime and cached Node dependencies
        run: |
          bash ci/remotion_b/setup_native.sh browser
          if [ ! -x ci/remotion_b/node_modules/.bin/remotion ]; then npm ci --prefix ci/remotion_b --no-audit --no-fund; fi
          echo "$GITHUB_WORKSPACE/ci/remotion_b/node_modules/@remotion/compositor-linux-x64-gnu" >> "$GITHUB_PATH"
          python -m pip install -q -r gate_chung/requirements.txt
          python -m gate_chung.setup
          npx --prefix ci/remotion_b remotion browser ensure
      - name: Remotion only, render both complete MP4s
        env:
          B_CHROME: ${{ github.workspace }}/.remotion/chrome-headless-shell/linux64/chrome-headless-shell-linux64/chrome-headless-shell
        run: python -u ci/remotion_b/compose.py
      - name: Full FFmpeg for the original fps and freezedetect gates
        if: always()
        run: python ci/remotion_b/gate_ffmpeg.py
      - name: Universal D18 gates on both actual MP4s
        id: common
        if: always()
        run: |
          python ci/remotion_b/export_gate_plan.py --video-root work/B --out work/B/plans
          set +e
          python -m gate_chung --video work/B/B_60s_16x9.mp4 --plan work/B/plans/16x9.json --genre the_loai/khoa_hoc_vat_ly.json --out work/B/gate_chung_16x9
          d18_land=$?
          python -m gate_chung --video work/B/B_60s_9x16.mp4 --plan work/B/plans/9x16.json --genre the_loai/khoa_hoc_vat_ly.json --out work/B/gate_chung_9x16
          d18_portrait=$?
          exit $((d18_land || d18_portrait))
      - name: Unchanged 540p gates, ffprobe, sheets and A-B report
        id: gates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python ci/remotion_b/measure.py
          b_gate_exit=$?
          if [ '${{ steps.common.outcome }}' != 'success' ]; then b_gate_exit=1; fi
          if [ "$b_gate_exit" -eq 0 ]; then echo 'result=DAT' >> "$GITHUB_OUTPUT"; else echo 'result=TRUOT' >> "$GITHUB_OUTPUT"; fi
          exit "$b_gate_exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B-60s-540p
          retention-days: 14
          path: |
            work/B/B_60s_16x9.mp4
            work/B/B_60s_9x16.mp4
            work/B/contact_sheet_*.jpg
            work/B/*.json
            work/B/*.md
            work/B/plans/
            work/B/gate_chung_16x9/
            work/B/gate_chung_9x16/
            ci/so_sanh_AB.json
            ci/remotion_b/evidence/
  native-1080:
    name: Native 1080p after green 540p gates
    needs: remotion
    if: needs.remotion.outputs.gates == 'DAT' && github.event_name == 'workflow_dispatch' && inputs.render_1080
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: B-pip-${{ runner.os }}-py311-${{ hashFiles('ci_requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: ci/remotion_b/node_modules
          key: B-node-${{ runner.os }}-22-${{ hashFiles('ci/remotion_b/package-lock.json') }}
      - name: Native dependencies
        run: |
          bash ci/remotion_b/setup_native.sh manim
          bash ci/remotion_b/setup_native.sh browser
          python -m pip install -q -r ci_requirements.txt
          if [ ! -x ci/remotion_b/node_modules/.bin/remotion ]; then npm ci --prefix ci/remotion_b --no-audit --no-fund; fi
          echo "$GITHUB_WORKSPACE/ci/remotion_b/node_modules/@remotion/compositor-linux-x64-gnu" >> "$GITHUB_PATH"
          npx --prefix ci/remotion_b remotion browser ensure
      - name: Render native 1080p, no upscaling of Manim
        env:
          B_SHORT_SIDE: '1080'
          B_CHROME: ${{ github.workspace }}/.remotion/chrome-headless-shell/linux64/chrome-headless-shell-linux64/chrome-headless-shell
        run: |
          python -u ci/remotion_b/prepare.py --short-side 1080 --jobs 2
          python -u ci/remotion_b/compose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B-60s-native-1080p
          retention-days: 14
          path: work/B1080/
