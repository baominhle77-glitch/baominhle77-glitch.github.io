name: Kiểm tra Hội Chọn Đúng chỉ sàn Việt Nam

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vn-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Giải nén nguồn V2
        run: |
          node tools/apply-choice-product-v2.mjs
          node --check backend/choice.js
          grep -q 'CHOICE_PRODUCT_EXPERIENCE_V2' backend/choice.js

      - name: Áp taxonomy 12 lĩnh vực V2
        run: node tools/apply-choice-multiniche-v2.mjs
      - name: Áp marketplace Việt Nam V2
        run: node tools/apply-choice-vn-marketplace.mjs

      - name: Tái giải nén nguồn V2
        run: node tools/apply-choice-product-v2.mjs
      - name: Chạy lại taxonomy V2
        run: node tools/apply-choice-multiniche-v2.mjs
      - name: Chạy lại marketplace V2
        run: node tools/apply-choice-vn-marketplace.mjs

      - name: Kiểm tra marker marketplace V2
        run: |
          set -euo pipefail
          node --check backend/choice-autopilot.js
          node --check backend/choice.js
          grep -q 'CHOICE_PRODUCT_EXPERIENCE_V2' backend/choice.js
          grep -q 'VIETNAM_MARKETPLACE_POLICY_V1' backend/choice-autopilot.js
          grep -q 'const globalSelectedSources = new Set()' backend/choice-autopilot.js
          grep -q 'globalSelectedSources.has(candidate.source_id)' backend/choice-autopilot.js
          grep -q 'DATAFEED_BEST_CATEGORY_V1' backend/choice-autopilot.js
          grep -q 'const MAX_PRODUCTS_PER_CATEGORY = 12;' backend/choice-autopilot.js
          grep -q 'id: "travel"' backend/choice-autopilot.js
          ! grep -qiE 'fado\.vn|amazon\.|taobao|alibaba|ebay' backend/choice-autopilot.js

      - name: Kiểm tra catalog lõi
        run: node --test backend/choice.test.mjs
      - name: Kiểm tra redirect và offer theo shop
        run: node --test backend/choice-vn-marketplace.test.mjs
      - name: Kiểm tra Affiliate Autopilot
        run: node --test backend/choice-autopilot.test.mjs
      - name: Kiểm tra frontend affiliate-only
        run: |
          node --test hoi-chon-dung/app.test.mjs
          ! grep -RqiE 'Link tham khảo|google\.com/search|SEED_PRODUCTS|seed-products' hoi-chon-dung/*.js hoi-chon-dung/*.html hoi-chon-dung/sw.js

      - name: Materialize đầy đủ Worker owner revenue
        run: |
          node tools/apply-travel-system.mjs
          node tools/apply-choice-system.mjs
          node tools/apply-choice-setup.mjs
          node tools/apply-choice-credential-bootstrap.mjs
          node tools/apply-choice-revenue.mjs
          node tools/apply-choice-autopilot-ui.mjs
          node --check backend/worker.js
          node --check backend/choice-setup.js
          node --check backend/choice-revenue.js

      - name: Kiểm tra boundary backend
        run: node --test backend/choice-public-boundary.test.mjs
      - name: Quét nội dung public
        run: |
          node tools/check-public-content.mjs
          grep -q 'Public audience boundary v4' hoi-chon-dung/index.html
          grep -q 'hoi-chon-dung-v5' hoi-chon-dung/sw.js
