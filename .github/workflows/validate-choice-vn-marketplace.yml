name: Kiểm tra Hội Chọn Đúng chỉ sàn Việt Nam

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-vn-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Materialize đúng thứ tự và kiểm tra idempotency
        run: |
          set -euo pipefail
          node tools/apply-choice-multiniche.mjs
          node tools/apply-choice-access-fallback.mjs
          node tools/apply-choice-vn-marketplace.mjs
          node tools/apply-choice-global-dedupe.mjs
          node tools/apply-choice-vn-marketplace.mjs
          node tools/apply-choice-global-dedupe.mjs
          node --check backend/choice-autopilot.js
          node --check backend/choice.js
          grep -q 'VIETNAM_MARKETPLACE_POLICY_V1' backend/choice-autopilot.js
          grep -q 'GLOBAL_PRODUCT_DEDUPE_V1' backend/choice-autopilot.js
          grep -q 'DATAFEED_BEST_CATEGORY_V1' backend/choice-autopilot.js
          grep -q 'const MAX_PRODUCTS_PER_CATEGORY = 12;' backend/choice-autopilot.js
          grep -q 'VIETNAM_MARKETPLACE_PUBLIC_V1' backend/choice.js
          ! grep -qiE 'fado\.vn|amazon\.|taobao|alibaba|ebay' backend/choice-autopilot.js

      - name: Kiểm tra catalog cũ không hồi quy
        run: node --test backend/choice.test.mjs

      - name: Kiểm tra sàn Việt Nam, redirect và nhóm nhiều nơi bán
        run: node --test backend/choice-vn-marketplace.test.mjs

      - name: Kiểm tra Affiliate Autopilot
        run: node --test backend/choice-autopilot.test.mjs

      - name: Chạy boundary backend có log đầy đủ
        id: boundary_test
        run: |
          set +e
          node --test backend/choice-public-boundary.test.mjs > "$RUNNER_TEMP/boundary-test.log" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/boundary-test.log"
          exit 0

      - name: Lưu stack trace boundary
        uses: actions/upload-artifact@v4
        with:
          name: boundary-test-log
          path: ${{ runner.temp }}/boundary-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Chặn theo mã thoát boundary
        if: steps.boundary_test.outputs.exit_code != '0'
        run: exit 1

      - name: Quét nội dung public
        run: node tools/check-public-content.mjs
