name: Deploy lên Cloudflare Pages (hiennhi89.pages.dev)

on:
  push:
    branches: [main]
    paths-ignore: [HANDOVER.md, "docs/handover/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "997944c1bfcc2dcaca32718124cd718c"
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: "https://hiennhi89.pages.dev/"
      GOOGLE_SEARCH_CONSOLE_SITEMAP_URL: "https://hiennhi89.pages.dev/hoi-chon-dung/sitemap.xml"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Kiểm tra cấu hình Cloudflare
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.112.0 secret list --config backend/wrangler.toml --format json > "$RUNNER_TEMP/secrets.json"
          node - <<'NODE' "$RUNNER_TEMP/secrets.json"
          const values = require(process.argv[2]).map(({name}) => name);
          for (const name of ["SESSION_SECRET","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","TELEGRAM_WEBHOOK_SECRET"]) if (!values.includes(name)) throw new Error(`Worker thiếu ${name}`);
          if (!values.includes("DECRYPT_KEY_BOITOAN") && !values.includes("DECRYPT_KEY")) throw new Error("Worker thiếu khóa giải mã Bói toán");
          NODE

      - name: Materialize hệ thống theo đúng thứ tự
        run: |
          set -euo pipefail
          node tools/apply-choice-product-v2.mjs
          node tools/apply-travel-system.mjs
          node tools/apply-choice-multiniche.mjs
          node tools/apply-choice-access-fallback.mjs
          node tools/apply-choice-seo-multiniche.mjs
          node tools/apply-choice-system.mjs
          node tools/apply-choice-setup.mjs
          node tools/apply-choice-credential-bootstrap.mjs
          node tools/apply-choice-revenue.mjs
          node tools/apply-choice-autopilot-ui.mjs
          grep -q 'CHOICE_PRODUCT_EXPERIENCE_V2' backend/choice.js
          grep -q 'choice-vn-marketplace-v2-ok' tools/apply-choice-vn-marketplace.mjs

      - name: Ban Thanh tra chạy regression và public boundary
        run: |
          set -euo pipefail
          node --check assets/gate.js
          node --check assets/community.js
          node --check assets/community-admin.js
          node assets/gate.test.mjs
          node assets/account-v2.test.mjs
          node boitoan/sw.test.mjs
          node --check backend/community.js
          node backend/community.test.mjs
          node backend/account-v2.test.mjs
          node backend/admin-v8-health.test.mjs
          node --check backend/worker.js
          node backend/worker.test.mjs
          node --test backend/travel.test.mjs
          node --check backend/choice.js
          node --test backend/choice.test.mjs
          node --check backend/choice-autopilot.js
          node --test backend/choice-autopilot.test.mjs
          node --test backend/choice-vn-marketplace.test.mjs
          node --test backend/choice-public-boundary.test.mjs
          node --check backend/choice-setup.js
          node --test backend/choice-setup.test.mjs
          node --check backend/choice-credential-bootstrap.js
          node --test backend/choice-credential-bootstrap.test.mjs
          node --check backend/choice-revenue.js
          node --test backend/choice-revenue.test.mjs
          node --check tools/build-choice-seo.mjs
          node --test tools/choice-seo.test.mjs
          for file in hoi-chon-dung/shared.js hoi-chon-dung/app.js hoi-chon-dung/explore.js hoi-chon-dung/product.js hoi-chon-dung/advisor.js hoi-chon-dung/compare.js hoi-chon-dung/sw.js; do node --check "$file"; done
          node --test hoi-chon-dung/app.test.mjs
          node tools/check-public-content.mjs
          grep -q 'hoi-chon-dung-v5' hoi-chon-dung/sw.js
          ! grep -RqiE 'Link tham khảo|google\.com/search|SEED_PRODUCTS' hoi-chon-dung/*.js hoi-chon-dung/*.html hoi-chon-dung/sw.js

      - name: Tạo trang SEO từ catalog live, không dùng seed fallback
        run: |
          set -euo pipefail
          node tools/build-choice-seo.mjs --out "$RUNNER_TEMP/choice-seo"
          test -s "$RUNNER_TEMP/choice-seo/sitemap.xml"
          test -s "$RUNNER_TEMP/choice-seo/feed.xml"
          test -s "$RUNNER_TEMP/choice-seo/seo-urls.json"
          test -s "$RUNNER_TEMP/choice-seo/danh-muc/cong-nghe-phu-kien-so/index.html"
          test -s "$RUNNER_TEMP/choice-seo/danh-muc/du-lich-di-chuyen/index.html"

      - name: Gộp site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/boitoan _site/assets _site/medora _site/vietnam-travel/data _site/hoi-chon-dung
          cp index.html manifest.webmanifest sw.js robots.txt e4c968d6c15b4ef69083f88f4f8d1e76.txt google91001f63e8104533.html BingSiteAuth.xml _site/
          cp assets/gate.js assets/gate.css assets/community.js assets/community-admin.js assets/community.css _site/assets/
          cp boitoan/index.html boitoan/community.html boitoan/community-admin.html boitoan/sw.js boitoan/manifest.webmanifest boitoan/icon-192.png boitoan/icon.png _site/boitoan/
          cp medora/index.html _site/medora/index.html
          cp vietnam-travel/index.html vietnam-travel/app.css vietnam-travel/app.js vietnam-travel/manifest.webmanifest vietnam-travel/sw.js vietnam-travel/icon.svg _site/vietnam-travel/
          cp vietnam-travel/data/seed-places.js _site/vietnam-travel/data/
          cp -R hoi-chon-dung/. _site/hoi-chon-dung/
          rm -rf _site/hoi-chon-dung/data _site/hoi-chon-dung/autopilot-ui.js _site/hoi-chon-dung/*.test.mjs
          cp "$RUNNER_TEMP/choice-seo/sitemap.xml" "$RUNNER_TEMP/choice-seo/feed.xml" _site/hoi-chon-dung/
          cp -R "$RUNNER_TEMP/choice-seo/san-pham" "$RUNNER_TEMP/choice-seo/danh-muc" "$RUNNER_TEMP/choice-seo/huong-dan" _site/hoi-chon-dung/
          node tools/check-public-content.mjs _site

      - name: Deploy Worker trước Pages
        working-directory: backend
        run: |
          set -euo pipefail
          trigger="$(openssl rand -hex 32)"
          echo "::add-mask::$trigger"
          echo "CHOICE_AUTOPILOT_TRIGGER_RUNTIME=$trigger" >> "$GITHUB_ENV"
          printf '%s' "$trigger" | npx --yes wrangler@4.112.0 secret put CHOICE_AUTOPILOT_TRIGGER
          npx --yes wrangler@4.112.0 deploy

      - name: Tái tạo catalog affiliate
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/growth.json" -w '%{http_code}' -X POST -H "x-choice-autopilot-trigger: $CHOICE_AUTOPILOT_TRIGGER_RUNTIME" "https://hiennhi89-gate.hiennhi89.workers.dev/api/choice/autopilot/run" || true)
            if [ "$code" = "200" ] && grep -Eq '"ok":(true|false)' "$RUNNER_TEMP/growth.json"; then cat "$RUNNER_TEMP/growth.json"; break; fi
            sleep 4
          done

      - name: Deploy Pages
        run: npx --yes wrangler@4.112.0 pages deploy _site --project-name hiennhi89 --branch main --commit-dirty=true

      - name: Thông báo search engines
        continue-on-error: true
        run: |
          node tools/submit-indexnow.mjs "$RUNNER_TEMP/choice-seo/seo-urls.json"
          node tools/submit-google-sitemap.mjs

      - name: Hậu kiểm production Hội Chọn Đúng V2
        run: |
          set -euo pipefail
          bust="choice-v2=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          for attempt in $(seq 1 30); do
            home=$(curl -fsSL "https://hiennhi89.pages.dev/hoi-chon-dung/?$bust" || true)
            explore=$(curl -fsSL "https://hiennhi89.pages.dev/hoi-chon-dung/kham-pha.html?$bust" || true)
            product_page=$(curl -fsSL "https://hiennhi89.pages.dev/hoi-chon-dung/san-pham.html?$bust" || true)
            sw=$(curl -fsSL "https://hiennhi89.pages.dev/hoi-chon-dung/sw.js?$bust" || true)
            health=$(curl -fsSL "https://hiennhi89-gate.hiennhi89.workers.dev/api/choice/health" || true)
            products=$(curl -fsSL "https://hiennhi89-gate.hiennhi89.workers.dev/api/choice/products?limit=20" || true)
            if grep -q 'Chỉ link affiliate đã xác minh' <<<"$home" \
              && grep -q 'Khám phá sản phẩm' <<<"$explore" \
              && grep -q 'Chi tiết sản phẩm và nơi bán' <<<"$product_page" \
              && grep -q 'hoi-chon-dung-v5' <<<"$sw" \
              && grep -q '"product_experience":"v2"' <<<"$health" \
              && grep -q '"affiliate_only":true' <<<"$products" \
              && ! grep -qiE 'Link tham khảo|google\.com/search|SEED_PRODUCTS' <<<"$home$explore$product_page"; then
                printf '%s' "$products" > "$RUNNER_TEMP/choice-products.json"
                node - <<'NODE' "$RUNNER_TEMP/choice-products.json"
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.argv[2],'utf8'); const data=JSON.parse(raw);
          for(const p of data.products||[]) for(const o of p.offers||[]) {
            if(!o.outbound_path?.startsWith('/r/choice/')) throw new Error('offer thiếu redirect nội bộ');
            if('affiliate_url' in o || 'merchant_url' in o) throw new Error('API lộ URL thô');
          }
          NODE
                echo "Production Hội Chọn Đúng V2 đạt ở lần $attempt"
                exit 0
            fi
            sleep 4
          done
          echo "Production Hội Chọn Đúng V2 chưa đạt" >&2
          exit 1
