name: Kiểm tra hệ thống tài khoản Khách Reader Admin

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Xác nhận source trực tiếp
        run: |
          set -euo pipefail
          before=$(git status --porcelain)
          node tools/apply-role-system.mjs
          node tools/apply-account-v2-runner.mjs
          node tools/apply-account-v3-hotfix.mjs
          after=$(git status --porcelain)
          test "$before" = "$after"
          grep -q 'Bói toán V11' assets/gate.js

      - name: Kiểm tra cú pháp frontend Bói toán Community
        run: |
          node --check assets/gate.js
          node --check assets/community.js
          node --check assets/community-admin.js
      - name: Kiểm tra Gate frontend
        run: node assets/gate.test.mjs
      - name: Kiểm tra Account frontend
        run: node assets/account-v2.test.mjs
      - name: Kiểm tra Service Worker Bói toán
        run: node boitoan/sw.test.mjs
      - name: Kiểm tra cú pháp Community backend
        run: node --check backend/community.js
      - name: Kiểm tra Community backend
        run: node backend/community.test.mjs
      - name: Kiểm tra Account backend
        run: node backend/account-v2.test.mjs
      - name: Kiểm tra Admin health
        run: node backend/admin-v8-health.test.mjs
      - name: Kiểm tra Worker hiện hữu
        run: |
          node --check backend/worker.js
          node backend/worker.test.mjs

      - name: Materialize Hội Chọn Đúng V2 lần một
        run: |
          set -euo pipefail
          node tools/apply-choice-product-v2.mjs
          node tools/apply-choice-multiniche-v2.mjs
          node tools/apply-choice-vn-marketplace.mjs
          node tools/apply-choice-global-dedupe.mjs
          node tools/apply-choice-system.mjs
          node tools/apply-choice-setup.mjs
          node tools/apply-choice-credential-bootstrap.mjs
          node tools/apply-choice-revenue.mjs
          node tools/apply-choice-autopilot-ui.mjs

      - name: Materialize Hội Chọn Đúng V2 lần hai
        run: |
          set -euo pipefail
          node tools/apply-choice-product-v2.mjs
          node tools/apply-choice-multiniche-v2.mjs
          node tools/apply-choice-vn-marketplace.mjs
          node tools/apply-choice-global-dedupe.mjs
          node tools/apply-choice-system.mjs
          node tools/apply-choice-setup.mjs
          node tools/apply-choice-credential-bootstrap.mjs
          node tools/apply-choice-revenue.mjs
          node tools/apply-choice-autopilot-ui.mjs

      - name: Kiểm tra marker V2
        run: |
          grep -q 'CHOICE_PRODUCT_EXPERIENCE_V2' backend/choice.js
          grep -q 'rating_value: candidate.rating_value' backend/choice-autopilot.js
          grep -q 'const MAX_PRODUCTS_PER_CATEGORY = 12;' backend/choice-autopilot.js
          grep -q 'VIETNAM_MARKETPLACE_POLICY_V1' backend/choice-autopilot.js
          grep -q 'id: "travel"' backend/choice-autopilot.js
          grep -q 'GLOBAL_PRODUCT_DEDUPE_V1' backend/choice-autopilot.js

      - name: Kiểm tra Choice backend lõi
        run: |
          node --check backend/choice.js
          node --test backend/choice.test.mjs
          node --check backend/choice-autopilot.js
          node --test backend/choice-autopilot.test.mjs
          node --test backend/choice-vn-marketplace.test.mjs
      - name: Kiểm tra public boundary
        run: node --test backend/choice-public-boundary.test.mjs
      - name: Kiểm tra owner setup credential revenue
        run: |
          node --check backend/choice-setup.js
          node --test backend/choice-setup.test.mjs
          node --check backend/choice-credential-bootstrap.js
          node --test backend/choice-credential-bootstrap.test.mjs
          node --check backend/choice-revenue.js
          node --test backend/choice-revenue.test.mjs
          node --check backend/worker.js
          node backend/worker.test.mjs
          node tools/check-public-content.mjs

      - name: Kiểm tra frontend nhiều luồng
        run: |
          set -euo pipefail
          for file in hoi-chon-dung/shared.js hoi-chon-dung/app.js hoi-chon-dung/explore.js hoi-chon-dung/product.js hoi-chon-dung/advisor.js hoi-chon-dung/compare.js hoi-chon-dung/sw.js; do node --check "$file"; done
          node --test hoi-chon-dung/app.test.mjs
          grep -q 'hoi-chon-dung-v5' hoi-chon-dung/sw.js
          grep -q 'Public audience boundary v4' hoi-chon-dung/index.html
          ! grep -RqiE 'Link tham khảo|google\.com/search|SEED_PRODUCTS|seed-products' hoi-chon-dung/*.js hoi-chon-dung/*.html hoi-chon-dung/sw.js

      - name: Kiểm tra SEO live-only
        run: |
          set -euo pipefail
          node --check tools/build-choice-seo.mjs
          node --test tools/choice-seo.test.mjs
          mkdir -p "$RUNNER_TEMP/choice-seo"
          cat > "$RUNNER_TEMP/catalog.json" <<'JSON'
          {"products":[{"id":"test-product","name":"Sản phẩm thử","category":"tech","summary":"Dữ liệu thử","price_min":100000,"price_max":120000,"shop_count":1,"offers":[{"id":"offer-1","merchant":"Shop","marketplace":"shopee","marketplace_label":"Shopee","price_min":100000,"outbound_path":"/r/choice/offer-1"}]}]}
          JSON
          node tools/build-choice-seo.mjs --input "$RUNNER_TEMP/catalog.json" --out "$RUNNER_TEMP/choice-seo"
          test -s "$RUNNER_TEMP/choice-seo/sitemap.xml"
          test -s "$RUNNER_TEMP/choice-seo/san-pham/test-product/index.html"
          ! grep -RqiE 'Link tham khảo|google\.com/search|seed fallback' "$RUNNER_TEMP/choice-seo"

      - name: Kiểm tra điều phối và marker hệ thống
        run: |
          node tools/validate-coordination.mjs
          test "$(grep -c 'Hội Chọn Đúng API integration v2' backend/worker.js)" -eq 1
          test "$(grep -c 'Hội Chọn Đúng Telegram integration v2' backend/worker.js)" -eq 1
          test "$(grep -c 'Hội Chọn Đúng growth cycle 5m v1' backend/worker.js)" -eq 1
          grep -q 'runChoiceGrowthCycle' backend/worker.js
          grep -q 'crons = \["\*/5 \* \* \* \*"\]' backend/wrangler.toml

      - name: Kiểm tra WebKit với payload AES thật
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps webkit
          LOCAL_GATE_JS=1 node tools/admin-v9-return-webkit-check.mjs "$GITHUB_SHA"
