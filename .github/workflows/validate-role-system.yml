name: Kiểm tra hệ thống tài khoản Khách Reader Admin

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04  # ghim: Playwright 1.52 không cài được webkit trên ubuntu-latest (26.04)
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Xác nhận source trực tiếp
        run: |
          set -euo pipefail
          before=$(git status --porcelain)
          node tools/apply-role-system.mjs
          node tools/apply-account-v2-runner.mjs
          node tools/apply-account-v3-hotfix.mjs
          after=$(git status --porcelain)
          test "$before" = "$after"
          grep -q 'Bói toán V11' assets/gate.js
          grep -q 'openAppContent(data.key, "admin-session")' assets/gate.js

      - name: Kiểm tra cú pháp frontend Bói toán
        run: |
          set -euo pipefail
          node --check assets/gate.js
          node --check assets/community.js
          node --check assets/community-admin.js
          node --check tools/admin-v9-return-webkit-check.mjs
          node --check boitoan/sw.js

      - name: Kiểm tra Gate frontend
        run: node assets/gate.test.mjs

      - name: Kiểm tra Account frontend
        run: node assets/account-v2.test.mjs

      - name: Kiểm tra Service Worker Bói toán
        run: node boitoan/sw.test.mjs

      - name: Kiểm tra Community backend
        run: |
          set -euo pipefail
          node --check backend/community.js
          node backend/community.test.mjs
          node backend/account-v2.test.mjs
          node backend/admin-v8-health.test.mjs

      - name: Kiểm tra Worker lõi
        run: |
          set -euo pipefail
          node --check backend/worker.js
          node backend/worker.test.mjs

      - name: Materialize Travel vào Worker
        run: |
          set -euo pipefail
          node tools/apply-travel-system.mjs
          node --check backend/worker.js

      - name: Kiểm tra Worker sau materialize
        id: worker_after_materialize
        continue-on-error: true
        run: |
          set -uo pipefail
          node backend/worker.test.mjs > "$RUNNER_TEMP/worker-test.log" 2>&1

      - name: Lưu stack trace Worker
        if: steps.worker_after_materialize.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: worker-test-log
          path: ${{ runner.temp }}/worker-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Chặn khi Worker regression thất bại
        if: steps.worker_after_materialize.outcome == 'failure'
        run: |
          echo "Worker regression thất bại; stack trace đã được lưu trong artifact worker-test-log."
          exit 1

      - name: Kiểm tra xác minh search, ranh giới public và đã gỡ Hội Chọn Đúng
        run: |
          set -euo pipefail
          test "$(cat google91001f63e8104533.html)" = "google-site-verification: google91001f63e8104533.html"
          grep -q '<?xml version="1.0"?>' BingSiteAuth.xml
          grep -q '0241E6F1BFFED8BCC15C18665C1FAD6C' BingSiteAuth.xml
          node --check tools/check-public-content.mjs
          node tools/check-public-content.mjs
          # CHOICE-20261024-01: Hội Chọn Đúng đã gỡ hẳn — không còn mã, route, cron hay trang
          test ! -e hoi-chon-dung
          ! ls backend/choice* tools/*choice* >/dev/null 2>&1
          ! grep -qiE 'choice|Hội Chọn Đúng' backend/worker.js
          grep -q '^crons = \[\]' backend/wrangler.toml

      - name: Kiểm tra WebKit với payload AES thật
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps webkit
          LOCAL_GATE_JS=1 node tools/admin-v9-return-webkit-check.mjs "$GITHUB_SHA"
